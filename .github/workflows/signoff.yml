name: klt signoff

# This block's T1 tier state is graded, not hand-read: re-render the
# tier-verdict report from the committed block manifest and byte-compare the
# fresh output against the committed verdict of record. Whoever changes the
# manifest, the vendored checklist doc or the klayout-tools pin must
# regenerate the record in the same PR. See manifests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt
        run: pip install klayout-tools==0.8.0

      - name: Re-check the item-10 hygiene attestation
        # Hygiene artifacts must exist; checks marked local_only in the
        # inventory need the full toolchain and are carried, not re-run, here.
        run: |
          klt signoff --attest 10 --inventory manifests/hygiene-inventory.json \
              --check manifests/item10-attestation.json

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/sky130-ble-baseband.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # Exit 0 = every T1 item met; 3 = the grader ran clean but at
          # least one item is unmet. Both are valid runs. Anything else is a
          # hard error (manifest/doc unreadable, cited evidence malformed).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest, vendored tier doc, or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/sky130-ble-baseband.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/sky130-ble-baseband.signoff.json - the committed tier verdict is stale."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/sky130-ble-baseband.json \\"
            echo "      --tiers-doc manifests/design-evidence-tiers.md \\"
            echo "      --format json > manifests/sky130-ble-baseband.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/sky130-ble-baseband.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh: it matches a fresh klt signoff run."
