name: klt signoff

# This block's T1 tier state is graded, not hand-read: re-render the
# tier-verdict report from the committed block manifest and byte-compare the
# fresh output against the committed verdict of record. Whoever changes the
# manifest, the vendored checklist doc or the klayout-tools pin must
# regenerate the record in the same PR. See manifests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt
        run: pip install klayout-tools==0.9.2

      - name: Assert every envelope records the installed klt version
        # Each committed evidence envelope that carries a provenance block
        # names the klt build that produced it (provenance.klt_version). It
        # must match the pinned release this job just installed, or the
        # envelope was re-attested off-pin and the evidence provenance is
        # broken. The expected version is read from the installed tool, and
        # the envelope list from the block manifest, so neither can go stale
        # here. See manifests/README.md.
        #
        # One kind is exempt by contract, not by leniency -- and the
        # exemption is self-retiring: a klt functional-verification report
        # carries no provenance block at the pin (its verdict depends on no
        # PDK and no rule deck -- klt docs/cli/functional-verification.md;
        # upstream 2AMLogic/klayout-tools#5550's fix is unreleased), so it
        # is exempt only for as long as `provenance` is absent or null. The
        # day a future klt release ships provenance on FV reports and this
        # repo bumps the pin, the same klt_version assertion applies to them
        # instead of silently passing green. Such an envelope is instead
        # shape-checked here (status/counts/tests, the same envelope shape
        # klt signoff itself validates) and, like `make fv-check` enforces
        # on the reports directory, must contain no absolute host path --
        # committed evidence must not name the machine that produced it.
        # Its staleness is pinned by the manifest's content_hash over the
        # report's own bytes.
        #
        # The check lives in verification/fv/envelope_check.py, pure
        # Python stdlib on purpose: this job installs klt on bare system
        # Python (no .venv, no cocotb), so the checker must not import
        # suite.py, which pulls in cocotb (issue #208).
        run: |
          set -uo pipefail
          want="$(klt --version | awk '{print $2}')"
          python3 verification/fv/envelope_check.py \
              --manifest manifests/sky130-ble-baseband.json \
              --want-klt "$want"

      - name: Re-check the item-10 hygiene attestation
        # Hygiene artifacts must exist; checks marked local_only in the
        # inventory need the full toolchain and are carried, not re-run, here.
        run: |
          klt signoff --attest 10 --inventory manifests/hygiene-inventory.json \
              --check manifests/item10-attestation.json

      - name: Re-check the item-9 testbench attestation
        # Every inventoried bench must still exist and the pins must still
        # resolve; the cold start is marked local_only in the inventory
        # (it needs Icarus, Verilator, Yosys and the cocotb venv) and so is
        # carried from the committed envelope, not re-run here.
        run: |
          klt signoff --attest 9 --inventory manifests/testbench-inventory.json \
              --check manifests/item9-attestation.json

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/sky130-ble-baseband.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # Exit 0 = every T1 item met; 3 = the grader ran clean but at
          # least one item is unmet. Both are valid runs. Anything else is a
          # hard error (manifest/doc unreadable, cited evidence malformed).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest, vendored tier doc, or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/sky130-ble-baseband.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/sky130-ble-baseband.signoff.json - the committed tier verdict is stale."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/sky130-ble-baseband.json \\"
            echo "      --tiers-doc manifests/design-evidence-tiers.md \\"
            echo "      --format json > manifests/sky130-ble-baseband.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/sky130-ble-baseband.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh: it matches a fresh klt signoff run."
