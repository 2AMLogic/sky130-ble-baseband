name: sim
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make venv
      - run: make sim-test
      - name: Quick BER and PER sweeps (must finish in under 5 minutes)
        timeout-minutes: 5
        run: time make sim-quick
      - uses: actions/upload-artifact@v4
        with:
          name: sweeps-quick
          path: |
            flow/build/sim/ber.json
            flow/build/sim/per.json
